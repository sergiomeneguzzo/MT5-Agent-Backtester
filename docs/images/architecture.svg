<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="block" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10">
      <path d="M1,1 L9,9 M9,1 L1,9" stroke="#f85149" stroke-width="2.2"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#0d1117"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- column 1: callers -->
    <text x="40" y="52" fill="#8b949e" font-size="14" font-weight="600" letter-spacing="2">WHO ASKS</text>
    <g font-size="16" fill="#c9d1d9">
      <rect x="40" y="76" width="230" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="60" y="104" font-weight="700" fill="#f0f6fc">AI agent</text>
      <text x="60" y="126" font-size="13" fill="#8b949e">Claude Code · Cursor · Codex</text>
      <rect x="40" y="156" width="230" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="60" y="184" font-weight="700" fill="#f0f6fc">Terminal</text>
      <text x="60" y="206" font-size="13" fill="#8b949e">mt5agent backtest … --json</text>
      <rect x="40" y="236" width="230" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="60" y="264" font-weight="700" fill="#f0f6fc">Python / notebooks</text>
      <text x="60" y="286" font-size="13" fill="#8b949e">Tester(MT5Client.connect())</text>
    </g>

    <!-- column 2: mt5agent -->
    <rect x="340" y="40" width="400" height="440" rx="14" fill="#0f2a1a" fill-opacity="0.35" stroke="#3fb950"/>
    <text x="364" y="72" fill="#7ee787" font-size="18" font-weight="800">mt5agent</text>
    <text x="456" y="72" fill="#8b949e" font-size="13">(this repo, stdlib only)</text>
    <g font-size="14">
      <rect x="364" y="92" width="352" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="384" y="116" fill="#f0f6fc" font-weight="700">mt5agent-mcp</text>
      <text x="384" y="135" fill="#8b949e" font-size="12.5">5 research tools for agents (stdio MCP server)</text>
      <rect x="364" y="156" width="352" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="384" y="180" fill="#f0f6fc" font-weight="700">Tester</text>
      <text x="384" y="199" fill="#8b949e" font-size="12.5">backtest · optimize · walk_forward · cleanup</text>
      <rect x="364" y="220" width="352" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="384" y="244" fill="#f0f6fc" font-weight="700">Report parsers</text>
      <text x="384" y="263" fill="#8b949e" font-size="12.5">.xlsx deals · .xml passes · broker info stripped</text>
      <rect x="364" y="284" width="352" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="384" y="308" fill="#f0f6fc" font-weight="700">MT5Client</text>
      <text x="384" y="327" fill="#8b949e" font-size="12.5">JSON-RPC over HTTP · session · read_bytes</text>
      <rect x="364" y="352" width="352" height="108" rx="8" fill="#2d1214" fill-opacity="0.6" stroke="#f85149"/>
      <text x="384" y="378" fill="#ff7b72" font-weight="800">Safety guard</text>
      <text x="384" y="400" fill="#c9d1d9" font-size="12.5">trade_* tools refused and hidden by default</text>
      <text x="384" y="420" fill="#c9d1d9" font-size="12.5">temp .ini/.set/.xlsx deleted after each run</text>
      <text x="384" y="440" fill="#c9d1d9" font-size="12.5">only charts opened by the run get closed</text>
    </g>

    <!-- column 3: MetaTrader 5 -->
    <rect x="820" y="40" width="340" height="440" rx="14" fill="#0c2d6b" fill-opacity="0.25" stroke="#1f6feb"/>
    <text x="844" y="72" fill="#79c0ff" font-size="18" font-weight="800">MetaTrader 5</text>
    <text x="968" y="72" fill="#8b949e" font-size="13">build 6230+</text>
    <g font-size="14">
      <rect x="844" y="92" width="292" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="864" y="118" fill="#f0f6fc" font-weight="700">Built-in MCP server</text>
      <text x="864" y="140" fill="#8b949e" font-size="12.5">127.0.0.1:22346 · Bearer key</text>
      <rect x="844" y="180" width="292" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="864" y="206" fill="#f0f6fc" font-weight="700">Strategy Tester</text>
      <text x="864" y="228" fill="#8b949e" font-size="12.5">agents · real ticks · optimizer</text>
      <rect x="844" y="268" width="292" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="864" y="294" fill="#f0f6fc" font-weight="700">Reports</text>
      <text x="864" y="316" fill="#8b949e" font-size="12.5">MQL5\Files\mt5agent_*.xlsx / .xml</text>
      <rect x="844" y="380" width="292" height="70" rx="8" fill="#2d1214" fill-opacity="0.6" stroke="#f85149" stroke-dasharray="5 4"/>
      <text x="864" y="406" fill="#ff7b72" font-weight="700">trade_* tools</text>
      <text x="864" y="428" fill="#8b949e" font-size="12.5">live orders — never reached</text>
    </g>

    <!-- arrows -->
    <g stroke="#8b949e" stroke-width="2" fill="none">
      <path d="M270 108 L364 119" marker-end="url(#arrow)"/>
      <path d="M270 188 L364 183" marker-end="url(#arrow)"/>
      <path d="M270 268 L364 190" marker-end="url(#arrow)"/>
      <path d="M716 311 L844 127" marker-end="url(#arrow)"/>
      <path d="M990 162 L990 180" marker-end="url(#arrow)"/>
      <path d="M990 250 L990 268" marker-end="url(#arrow)"/>
      <path d="M844 303 C 790 303, 770 250, 716 247" marker-end="url(#arrow)"/>
    </g>
    <path d="M716 406 L844 412" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-mid="url(#block)"/>
    <g transform="translate(780,409)"><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#f85149" stroke-width="3"/></g>
    <g font-size="11.5" text-anchor="middle">
      <rect x="738" y="196" width="64" height="20" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="770" y="210" fill="#c9d1d9">JSON-RPC</text>
      <rect x="732" y="262" width="104" height="20" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="784" y="276" fill="#c9d1d9">read_binary_file</text>
    </g>
  </g>
</svg>
